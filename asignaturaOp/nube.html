<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Defender: DAW BOSS EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        :root {
            --bg-dark: #020205;
            --neon-blue: #00f3ff;
            --neon-red: #ff003c;
            --neon-yellow: #fbff00;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            background: var(--bg-dark);
            color: white;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #071026 0%, #000 100%);
            position: relative;
            overflow: hidden;
            cursor: auto;
        }

        .overlay {
            cursor: auto;
        }

        /* Parallax clouds */
        .bg-cloud {
            position: absolute;
            top: 10%;
            left: -30%;
            width: 300px;
            height: 120px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            filter: blur(12px) saturate(1.2);
            transform: scale(1.6);
            animation: cloud-move linear infinite;
            pointer-events: none;
            z-index: 20;
        }

        .bg-cloud.small {
            width: 180px;
            height: 70px;
            top: 30%;
            opacity: 0.08;
            transform: scale(1);
            filter: blur(6px);
        }

        .bg-cloud.med {
            width: 260px;
            height: 100px;
            top: 5%;
            opacity: 0.09;
            transform: scale(1.2);
        }

        .bg-cloud.large {
            width: 420px;
            height: 170px;
            top: 50%;
            opacity: 0.06;
            transform: scale(1.8);
        }

        @keyframes cloud-move {
            from {
                transform: translateX(-40vw)
            }

            to {
                transform: translateX(140vw)
            }
        }

        /* --- HUD --- */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .stat {
            font-size: 1.2rem;
            color: var(--neon-blue);
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        #progress-bar {
            width: 250px;
            height: 12px;
            border: 2px solid #333;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            transition: width 0.3s;
        }

        /* --- PLAYER (NUBE QUANTICA) --- */
        #player {
            position: absolute;
            width: 150px;
            height: 95px;
            z-index: 500;
            left: 80px;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.5));
            transition: transform 0.1s ease-out;
        }

        .cloud-body {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .cloud-body canvas {
            position: absolute;
            left: -20%;
            top: -20%;
            width: 140%;
            height: 140%;
            z-index: 1;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }

        /* Visor integrado mejor */
        .visor {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 14px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            backdrop-filter: blur(2px);
        }

        .visor::after {
            content: none;
        }

        .eye {
            width: 10px;
            height: 4px;
            background: var(--neon-blue);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--neon-blue);
        }

        /* Remove old specific cloud styles that might conflict */
        .cloud-sheen {
            display: none;
        }

        #cloud-img {
            display: none;
        }

        @keyframes cloud-bob {
            0% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }

            100% {
                transform: translateY(0)
            }
        }


        /* --- ENEMIGOS Y OBJETOS --- */
        .entity {
            position: absolute;
            font-size: 2.5rem;
            z-index: 100;
            pointer-events: none;
        }

        .virus {
            filter: drop-shadow(0 0 10px var(--neon-red));
            animation: glitch 0.2s infinite;
        }

        .file {
            filter: drop-shadow(0 0 10px #0f0);
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }

            50% {
                transform: translate(-3px, 3px);
            }

            100% {
                transform: translate(3px, -3px);
            }
        }

        /* --- JEFE FINAL --- */
        #boss {
            position: absolute;
            width: 200px;
            height: 200px;
            z-index: 800;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: top 0.5s ease-out;
        }

        .boss-icon {
            font-size: 10rem;
            filter: drop-shadow(0 0 40px var(--neon-red));
            animation: pulse 1s infinite alternate;
            transform-origin: center;
        }

        .boss-entrance {
            animation: boss-entrance 1s ease-out forwards;
        }

        @keyframes boss-entrance {
            0% {
                transform: translateY(-100px) scale(0.2) rotate(-20deg);
                opacity: 0
            }

            60% {
                transform: translateY(20px) scale(1.15) rotate(10deg);
                opacity: 1
            }

            100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
        }

        .boss-icon.glow {
            animation: glow 1.6s infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 20px var(--neon-red))
            }

            to {
                filter: drop-shadow(0 0 50px #ff7a7a)
            }
        }

        .boss-label {
            background: var(--neon-red);
            color: white;
            padding: 5px 15px;
            font-weight: 900;
            font-size: 1.2rem;
            white-space: nowrap;
            border-radius: 5px;
            box-shadow: 0 0 20px var(--neon-red);
        }

        @keyframes pulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }
        }

        /* RAYOS */
        .bolt {
            position: absolute;
            height: 15px;
            background: var(--neon-yellow);
            box-shadow: 0 0 20px var(--neon-yellow);
            border-radius: 10px;
            z-index: 700;
        }


        /* DISPAROS DEL JUGADOR */
        .player-bolt {
            position: absolute;
            width: 20px;
            height: 5px;
            background: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            border-radius: 5px;
            z-index: 600;
        }

        /* Balas enemigo/jugador */
        .bullet {
            width: 14px;
            height: 6px;
            border-radius: 6px;
        }

        /* Partículas para explosiones */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            z-index: 1500;
            pointer-events: none;
        }

        /* VERDURAS */
        .vegetable {
            filter: drop-shadow(0 0 10px #0f0);
        }

        /* --- OVERLAYS --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #credits-screen p {
            font-size: 1.2rem;
            color: #cfeeff;
            margin: 8px 0;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            color: var(--neon-blue);
        }

        .btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Orbitron';
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 30px var(--neon-blue);
        }

        /* MODAL DE ESTUDIO */
        #theory-modal {
            background: #050510;
            border: 3px solid #0f0;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            text-align: left;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.2);
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="hud">
            <div class="stat">ENERGÍA: <span id="score">0</span> MB</div>
            <div class="stat" id="boss-health" style="display:none;">VIDA JEFE: <span id="boss-health-value">10</span>
            </div>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>

        <div id="boss">
            <div class="boss-label">Pablo el hacker de la nube</div>
            <div class="boss-icon">👾</div>
        </div>

        <div id="credits-screen" class="overlay hidden">
            <h1>CRÉDITOS</h1>
            <div id="credits-content" style="background:#04101a; padding:20px; border-radius:12px; margin-top:18px;">
                <p>Grupo 1 de la optativa del Alberto</p>
                <p>Desarrollo y diseño: Grupo 1</p>
                <p>Jefe: Pablo el hacker de la nuve</p>
            </div>
            <button class="btn" onclick="hideCredits()">VOLVER</button>
        </div>

        <div id="start-screen" class="overlay">
            <h1>CLOUD DEFENDER</h1>
            <p style="letter-spacing: 5px; color: var(--neon-red);">MODO: DELEGADO FINAL BOSS</p>
            <div style="margin-top:25px; display:flex; gap:12px;">
                <button class="btn" onclick="startGame('normal')">INICIAR (NORMAL)</button>
                <button class="btn" onclick="startGame('hard')">INICIAR (HARD)</button>
            </div>
            <button class="btn" onclick="showCredits()" style="margin-top:18px;">CRÉDITOS</button>
            <p style="margin-top:18px; font-size:0.9rem; color:#ccc;">Presiona <strong>Espacio</strong> o click
                izquierdo para disparar.</p>
        </div>

        <div id="theory-screen" class="overlay hidden">
            <div id="theory-modal">
                <h2 id="theory-title" style="color:#0f0">TEMA</h2>
                <p id="theory-content" style="line-height:1.6; font-size:1.1rem;"></p>
                <button class="btn" style="border-color:#0f0; color:#0f0;" onclick="resumeGame()">CONTINUAR
                    COMPILACIÓN</button>
            </div>
        </div>

        <div id="end-screen" class="overlay hidden">
            <h1 id="end-title">SISTEMA INFECTADO</h1>
            <p id="end-msg"></p>
            <button class="btn" onclick="location.reload()">REINTENTAR</button>
        </div>

        <div id="player">
            <div class="cloud-body">
                <canvas id="cloud-canvas"></canvas>
                <div class="visor">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const theoryData = [
            { t: "1. NUBE Y NIVELES", c: "El Cloud Computing ofrece servicios bajo demanda. Niveles: <b>IaaS</b> (Infraestructura), <b>PaaS</b> (Plataforma) y <b>SaaS</b> (Software)." },
            { t: "2. TRABAJO EN LA NUBE", c: "Permite la deslocalización y colaboración en tiempo real. Los activos digitales están siempre disponibles y sincronizados." },
            { t: "3. PROS Y CONTRAS", c: "Ventajas: Escalabilidad y ahorro. Desventajas: Dependencia de conexión y riesgos de seguridad externos." },
            { t: "4. RENTABILIDAD", c: "Paso de CAPEX a <b>OPEX</b>. Solo pagas por lo que consumes, eliminando costes fijos de mantenimiento de servidores." },
            { t: "5. EDGE COMPUTING", c: "Procesa los datos cerca de la fuente (sensores/móviles) para reducir latencia y ahorrar ancho de banda hacia la nube." },
            { t: "6. FOG Y MIST", c: "<b>Fog:</b> Capa intermedia de red. <b>Mist:</b> Procesamiento en el micro-chip del propio sensor. Distribución total de carga." },
            { t: "7. SOSTENIBILIDAD", c: "La nube centraliza recursos, optimizando el consumo energético y reduciendo la huella de carbono del hardware infrautilizado." },
            { t: "8. CIBERSEGURIDAD", c: "Incidentes: Ransomware, DDoS y Phishing. Clave: Encriptación, MFA y cumplimiento de normativas (RGPD)." }
        ];

        let state = {
            active: false,
            paused: false,
            score: 0,
            theoryIdx: 0,
            bossMode: false,
            bossY: 200,
            bossDir: 1,
            lastTime: 0,
            spawnTimer: 0,
            bossAttackTimer: 0,
            bossHealth: 10,
            vegetableTimer: 0
        };

        const player = document.getElementById('player');
        const boss = document.getElementById('boss');
        let mouseY = window.innerHeight / 2;
        let playerY = window.innerHeight / 2;
        const playerX = 80;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // Realistic Cloud Rendering System
        const cloudCanvas = document.getElementById('cloud-canvas');
        const cloudCtx = cloudCanvas.getContext('2d');
        let cloudPuffs = [];

        function initCloudCanvas() {
            const dpr = window.devicePixelRatio || 1;
            // Make canvas slightly larger than container for overflow fluffiness
            const bodyRect = document.querySelector('.cloud-body').getBoundingClientRect();
            // Actually use getComputedStyle because element might be hidden or off-screen
            const width = 150; // fixed relative to player css
            const height = 95;

            cloudCanvas.width = Math.floor(width * 1.4 * dpr);
            cloudCanvas.height = Math.floor(height * 1.4 * dpr);
            // No direct style reset here to avoid layout trashing, handle via CSS mostly
            cloudCtx.scale(dpr, dpr);

            // Generate "Puffs" - circles that make up the cloud
            cloudPuffs = [];
            const numPuffs = 45;

            // Central mass
            for (let i = 0; i < numPuffs; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 25; // spread from center reduced
                // Elliptical distribution
                const x = (width * 1.4) / 2 + Math.cos(angle) * dist * 1.5;
                const y = (height * 1.4) / 2 + Math.sin(angle) * dist * 0.8;
                const r = 18 + Math.random() * 22;

                cloudPuffs.push({
                    x: x, y: y,
                    baseX: x, baseY: y,
                    r: r,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.002 + Math.random() * 0.002
                });
            }
        }

        function drawCloud() {
            if (!cloudCtx) return;
            const w = cloudCanvas.width / (window.devicePixelRatio || 1);
            const h = cloudCanvas.height / (window.devicePixelRatio || 1);
            cloudCtx.clearRect(0, 0, w, h);

            const time = performance.now();

            // Draw puffs
            cloudPuffs.forEach(p => {
                // Gentle movement
                p.x = p.baseX + Math.sin(time * p.speed + p.phase) * 6;
                p.y = p.baseY + Math.cos(time * p.speed * 1.3 + p.phase) * 4;

                const grd = cloudCtx.createRadialGradient(p.x, p.y, p.r * 0.1, p.x, p.y, p.r);
                grd.addColorStop(0, "rgba(255, 255, 255, 0.95)");
                grd.addColorStop(0.6, "rgba(240, 248, 255, 0.8)"); // slight blueish white
                grd.addColorStop(1, "rgba(255, 255, 255, 0)");

                cloudCtx.fillStyle = grd;
                cloudCtx.beginPath();
                cloudCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                cloudCtx.fill();
            });

            // Optional: Internal light glow
            cloudCtx.globalCompositeOperation = 'overlay';
            cloudCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            cloudCtx.beginPath();
            cloudCtx.ellipse(w / 2, h / 2 - 10, w * 0.3, h * 0.2, 0, 0, Math.PI * 2);
            cloudCtx.fill();
            cloudCtx.globalCompositeOperation = 'source-over';
        }

        window.addEventListener('resize', () => { setTimeout(initCloudCanvas, 100); });
        // initialize immediately
        setTimeout(() => { try { initCloudCanvas(); } catch (e) { } }, 100);

        // Mouse tracking for slight 3D tilt effect on the whole player div is in update()
        let mouseX = window.innerWidth / 2;
        window.addEventListener('mousemove', e => {
            mouseY = e.clientY;
            mouseX = e.clientX;
        });

        function startGame(difficulty) {
            document.getElementById('start-screen').classList.add('hidden');
            state.active = true;
            state.lastTime = performance.now();
            state.theoryIdx = 0;
            state.score = 0;
            document.getElementById('score').innerText = 0;
            // Difficulty tuning
            state.spawnBase = difficulty === 'hard' ? 420 : 700;
            // ensure boss hidden
            boss.style.display = 'none';
            state.bossMode = false;
            requestAnimationFrame(update);
            playSfx('start');
        }

        function showCredits() {
            document.getElementById('credits-screen').classList.remove('hidden');
            // pause game while credits open
            state.paused = true;
        }

        function hideCredits() {
            document.getElementById('credits-screen').classList.add('hidden');
            state.paused = false;
        }

        function update(time) {
            if (!state.active) return;
            const delta = time - state.lastTime;
            state.lastTime = time;

            if (state.paused) {
                requestAnimationFrame(update);
                return;
            }

            // Movimiento Nube con ligera inclinación
            playerY += (mouseY - playerY) * 0.15;
            player.style.top = (playerY - 30) + 'px';
            player.style.left = playerX + 'px';
            const tilt = (mouseY - playerY) * 0.02;
            player.style.transform = `rotate(${tilt}deg)`;

            // Boss Logic
            if (state.bossMode) {
                updateBoss(delta);
            } else {
                // Spawn normal (Virus más rápidos y frecuentes)
                state.spawnTimer -= delta;
                if (state.spawnTimer <= 0) {
                    // Spawnear varios enemigos según progreso
                    const count = 1 + Math.floor(Math.random() * (1 + state.theoryIdx / 2));
                    for (let i = 0; i < count; i++) spawnEntity();
                    state.spawnTimer = (state.spawnBase || 600) - (state.theoryIdx * 50) - (Math.random() * 200);
                }
            }

            // update visuals
            drawCloud();
            moveEntities(delta);
            requestAnimationFrame(update);
        }

        function spawnEntity() {
            const el = document.createElement('div');
            // Tipos: virus pequeño, virus rápido, file (bueno)
            const r = Math.random();
            if (r < 0.7) { el.className = 'entity virus'; el.innerText = '🦠'; el.dataset.type = 'bad'; el.dataset.hp = 1; }
            else if (r < 0.92) { el.className = 'entity virus'; el.innerText = '☣️'; el.dataset.type = 'bad'; el.dataset.hp = 2; }
            else { el.className = 'entity file'; el.innerText = '💾'; el.dataset.type = 'good'; el.dataset.hp = 1; }

            const baseSpeed = el.dataset.type === 'bad' ? 0.45 + Math.random() * 0.6 : 0.35 + Math.random() * 0.4;
            el.dataset.speed = baseSpeed + (state.theoryIdx * 0.06);

            el.style.left = (window.innerWidth + Math.random() * 200) + 'px';
            el.style.top = (50 + Math.random() * (window.innerHeight - 140)) + 'px';
            document.getElementById('game-container').appendChild(el);
        }


        function spawnVegetable() {
            const el = document.createElement('div');
            el.className = 'entity vegetable';
            el.innerText = '🥕'; // Verdura
            el.dataset.type = 'vegetable';
            el.dataset.speed = 0.3; // Velocidad de caída

            el.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            el.style.top = '-50px';
            document.getElementById('game-container').appendChild(el);
        }

        function updateBoss(delta) {
            // Movimiento vertical del jefe
            state.bossY += 0.3 * delta * state.bossDir;
            if (state.bossY > window.innerHeight - 250 || state.bossY < 50) state.bossDir *= -1;

            boss.style.top = state.bossY + 'px';
            boss.style.left = (window.innerWidth - 300) + 'px';

            // Ataque de rayos
            state.bossAttackTimer -= delta;
            if (state.bossAttackTimer <= 0) {
                shootLightning();
                state.bossAttackTimer = 1200; // Un rayo cada 1.2s
            }

            // Spawn verduras si vida <=5
            if (state.bossHealth <= 5) {
                state.vegetableTimer -= delta;
                if (state.vegetableTimer <= 0) {
                    spawnVegetable();
                    state.vegetableTimer = 2000; // Cada 2s
                }
            }
        }

        function shootLightning() {
            const bolt = document.createElement('div');
            bolt.className = 'bolt';
            bolt.style.width = '100px';
            bolt.style.left = (window.innerWidth - 300) + 'px';
            bolt.style.top = (state.bossY + 120) + 'px';
            document.getElementById('game-container').appendChild(bolt);

            // Animación del rayo cruzando la pantalla
            let bx = (window.innerWidth - 300);
            function moveBolt() {
                bx -= 15;
                bolt.style.left = bx + 'px';
                bolt.style.width = (Math.random() * 50 + 100) + 'px'; // Efecto parpadeo

                const bRect = bolt.getBoundingClientRect();
                const pRect = player.getBoundingClientRect();

                if (checkCol(pRect, bRect)) gameOver("EL DELEGADO TE HA FULMINADO");

                if (bx > -200 && state.active) requestAnimationFrame(moveBolt);
                else bolt.remove();
            }
            moveBolt();
        }

        function shootPlayerBolt() {
            const bolt = document.createElement('div');
            bolt.className = 'player-bolt bullet';
            const startX = playerX + 120;
            bolt.style.left = startX + 'px';
            bolt.style.top = (playerY + 28) + 'px';
            document.getElementById('game-container').appendChild(bolt);
            playSfx('shoot');

            let bx = startX;
            function moveBolt() {
                bx += 18;
                bolt.style.left = bx + 'px';

                // Colisiones con entidades
                const blRect = bolt.getBoundingClientRect();
                let hit = false;
                document.querySelectorAll('.entity').forEach(ent => {
                    if (ent.dataset.type === 'bad' || ent.dataset.type === 'good') {
                        if (!hit && checkCol(blRect, ent.getBoundingClientRect())) {
                            hit = true;
                            // Reducir vida si existe
                            ent.dataset.hp = (parseInt(ent.dataset.hp) || 1) - 1;
                            if (ent.dataset.hp <= 0) {
                                explodeEntity(ent);
                                ent.remove();
                                if (ent.dataset.type === 'bad') { state.score += 75; document.getElementById('score').innerText = state.score; }
                                else { state.score += 125; document.getElementById('score').innerText = state.score; }
                            } else {
                                // Mark damaged
                                ent.style.opacity = 0.6;
                            }
                            bolt.remove();
                        }
                    }
                });

                // Colisión con boss
                if (!hit && state.bossMode) {
                    const bRect = boss.getBoundingClientRect();
                    if (checkCol(blRect, bRect)) {
                        hit = true;
                        bolt.remove();
                        state.bossHealth--;
                        playSfx('hit');
                        document.getElementById('boss-health-value').innerText = state.bossHealth;
                        if (state.bossHealth <= 0) {
                            gameOver("¡HAS DERROTADO AL DELEGADO! VICTORIA");
                        }
                    }
                }

                if (bx < window.innerWidth + 50 && state.active) requestAnimationFrame(moveBolt);
                else if (bolt.parentNode) bolt.remove();
            }
            moveBolt();
        }

        function explodeEntity(ent) {
            createParticles(parseFloat(ent.style.left) + 10, parseFloat(ent.style.top) + 10, ['#ff003c', '#00f3ff', '#fbff00']);
            playSfx('explode');
        }

        function createParticles(x, y, colors, count = 12) {
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = x + 'px'; p.style.top = y + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                document.getElementById('game-container').appendChild(p);
                const vx = (Math.random() - 0.5) * 6; const vy = (Math.random() - 0.8) * 6;
                let t = 0;
                function step() {
                    t += 1;
                    p.style.left = (x + vx * t) + 'px';
                    p.style.top = (y + vy * t + 0.5 * t) + 'px';
                    p.style.opacity = Math.max(0, 1 - t / 20);
                    if (t < 30) requestAnimationFrame(step); else p.remove();
                }
                step();
            }
        }

        function moveEntities(delta) {
            document.querySelectorAll('.entity').forEach(ent => {
                if (ent.dataset.type === 'vegetable') {
                    const y = parseFloat(ent.style.top) + (ent.dataset.speed * delta);
                    ent.style.top = y + 'px';

                    if (checkCol(player.getBoundingClientRect(), ent.getBoundingClientRect())) {
                        collectVegetable(ent);
                    }
                    if (y > window.innerHeight) ent.remove();
                } else {
                    const x = parseFloat(ent.style.left) - (ent.dataset.speed * delta);
                    ent.style.left = x + 'px';

                    if (checkCol(player.getBoundingClientRect(), ent.getBoundingClientRect())) {
                        if (ent.dataset.type === 'bad') {
                            explodeEntity(ent);
                            ent.remove();
                            gameOver("VIRUS DETECTADO");
                        } else collectFile(ent);
                    }

                    if (x < -100) ent.remove();
                }
            });
        }

        function collectFile(ent) {
            ent.remove();
            state.paused = true;
            const data = theoryData[state.theoryIdx];
            document.getElementById('theory-title').innerText = data.t;
            document.getElementById('theory-content').innerHTML = data.c;
            document.getElementById('theory-screen').classList.remove('hidden');

            state.score += 125;
            document.getElementById('score').innerText = state.score;
        }

        function collectVegetable(ent) {
            ent.remove();
            state.score += 50; // Puntos por verdura
            document.getElementById('score').innerText = state.score;
        }

        function resumeGame() {
            document.getElementById('theory-screen').classList.add('hidden');
            state.theoryIdx++;
            const progress = (state.theoryIdx / 8) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';

            if (state.theoryIdx >= 8) {
                // Entrada épica del jefe
                enterBoss();
            }

            state.lastTime = performance.now();
            // Align mouse target to current player position to prevent jump
            mouseY = playerY;
            state.paused = false;
        }

        function enterBoss() {
            state.bossMode = true;
            state.bossHealth = 16 + (Math.random() * 8 | 0);
            document.getElementById('boss-health-value').innerText = state.bossHealth;
            document.getElementById('boss-health').style.display = 'block';
            document.querySelectorAll('.entity').forEach(e => e.remove());
            boss.style.display = 'flex';
            boss.style.top = '-400px';
            boss.style.left = (window.innerWidth / 2 - 120) + 'px';
            boss.style.transform = 'scale(0.2)';
            // animación de zoom y shake
            let t = 0;
            function anim() {
                t++;
                boss.style.top = (-400 + t * 18) + 'px';
                boss.style.transform = 'scale(' + Math.min(1, 0.2 + t * 0.02) + ')';
                if (t < 10) {
                    // start boss icon entrance
                    const ic = boss.querySelector('.boss-icon');
                    if (ic && !ic.classList.contains('boss-entrance')) ic.classList.add('boss-entrance', 'glow');
                }
                if (t < 40) requestAnimationFrame(anim);
                else { playSfx('boss'); state.bossY = parseFloat(boss.style.top); }
            }
            anim();
        }

        function gameOver(msg) {
            state.active = false;
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('end-title').innerText = msg.includes("VICTORIA") ? "¡VICTORIA!" : "SISTEMA INFECTADO";
            document.getElementById('end-msg').innerText = msg;
            document.getElementById('game-container').style.filter = msg.includes("VICTORIA") ? "hue-rotate(90deg)" : "hue-rotate(180deg)";
        }

        function checkCol(r1, r2) {
            return !(r1.right < r2.left + 20 || r1.left > r2.right - 20 || r1.bottom < r2.top + 20 || r1.top > r2.bottom - 20);
        }

        window.addEventListener('mousemove', e => mouseY = e.clientY);
        // Disparar con espacio o click
        window.addEventListener('keydown', e => {
            if ((e.code === 'Space' || e.key === ' ') && state.active && !state.paused) {
                shootPlayerBolt();
                e.preventDefault();
            }
        });
        window.addEventListener('click', e => {
            if (state.active && !state.paused) shootPlayerBolt();
        });

        // Simple SFX con WebAudio
        function playSfx(kind) {
            try {
                const now = audioCtx.currentTime;
                if (kind === 'shoot') {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'sawtooth'; o.frequency.setValueAtTime(900, now);
                    g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
                    o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.26);
                } else if (kind === 'explode' || kind === 'hit') {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'square'; o.frequency.setValueAtTime(200, now); o.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                    g.gain.setValueAtTime(0.02, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
                    o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.4);
                } else if (kind === 'start' || kind === 'boss') {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'triangle'; o.frequency.setValueAtTime(kind === 'boss' ? 120 : 400, now);
                    g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.06, now + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
                    o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 1.2);
                } else if (kind === 'victory') {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'sine'; o.frequency.setValueAtTime(600, now); o.frequency.exponentialRampToValueAtTime(1200, now + 0.4);
                    g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
                    o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.9);
                } else if (kind === 'dead') {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'sawtooth'; o.frequency.setValueAtTime(120, now); g.gain.setValueAtTime(0.02, now);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2); o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 1.2);
                }
            } catch (e) { /* audioCtx podría estar bloqueado por autoplay */ }
        }
    </script>
</body>

</html>
